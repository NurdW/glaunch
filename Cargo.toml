# Workspace: the CLI stays at the repo root (upstream layout untouched) and
# the GUI lives in gui/ so upstream changes stay easy to pull.
[workspace]
members = ["gui"]
# Plain `cargo build` in the repo root builds the CLI *and* the GUI.
default-members = [".", "gui"]

[package]
name = "glaunch"
version = "0.1.0"
edition = "2024"
description = "Steam game launch wrapper with gamescope, gamemode, HDR, V-Cache, and per-game profiles"

[[bin]]
name = "glaunch"
path = "src/main.rs"

[lib]
name = "glaunch"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3.27.0"
